<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I-PORTER</title>
<style>
:root{--bg:#f6f2fb;--card:#fff;--tx:#21152f;--mu:#6b6080;--pr:#6a2fb8;--pr2:#eee5fa;--bd:#ddd2ec;--ok:#2b8a3e;--wn:#e67700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18112a;--card:#241a38;--tx:#efe9f8;--mu:#a99bc2;--pr:#8b5cf6;--pr2:#33244f;--bd:#3d2f5a;--ok:#51cf66;--wn:#fab005}}
:root[data-theme="dark"]{--bg:#18112a;--card:#241a38;--tx:#efe9f8;--mu:#a99bc2;--pr:#8b5cf6;--pr2:#33244f;--bd:#3d2f5a;--ok:#51cf66;--wn:#fab005}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--pr);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:20px}header small{opacity:.85}
nav{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font-weight:600;cursor:pointer}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 8px;color:var(--pr)}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps div{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-size:12px;color:var(--mu)}
.steps div.on{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:700}
.steps div.done{background:var(--pr2);color:var(--pr)}
.svc{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
.svc:hover{border-color:var(--pr);background:var(--pr2)}
.svc b{margin-right:8px;font-size:20px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{margin:0;flex:1;min-width:95px;border:1px solid var(--bd);border-radius:8px;padding:9px 6px;text-align:center;cursor:pointer;color:var(--tx);font-size:13px}
.opts input{display:none}.opts label.sel{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn{padding:11px 16px;border:0;border-radius:8px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer;font-size:15px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin-top:14px}
.porters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.porters button{padding:22px 6px;font-size:18px;font-weight:700;border-radius:10px;border:2px solid var(--pr);background:var(--pr2);color:var(--pr);cursor:pointer}
.porters button:hover{background:var(--pr);color:#fff}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:14px}.kv span:nth-child(odd){color:var(--mu)}
.tb{width:100%;text-align:left;padding:12px;margin-bottom:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.tb:disabled{opacity:.45;cursor:not-allowed}.tb.done{background:var(--pr2);border-color:var(--ok);color:var(--ok)}
.tb.next{border-color:var(--pr);border-width:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr)}
.tag.ok{color:var(--ok)}.tag.wn{color:var(--wn)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;cursor:pointer}
.tabs button.on{background:var(--pr);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:1000px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}.stats b{display:block;font-size:22px;color:var(--pr)}.stats span{font-size:12px;color:var(--mu)}
.pop{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);margin:0 auto;width:min(92%,420px);z-index:20;background:var(--wn);color:#111;border-radius:12px;padding:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:d .3s}
.pop small{display:block;font-weight:500;margin-top:2px}
@keyframes d{from{transform:translateY(-30px);opacity:0}}
.empty{color:var(--mu);text-align:center;padding:20px}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:105px 1fr}}
.tabs{flex-wrap:wrap}.tabs button{min-width:45%;font-size:12px;padding:9px 6px}
.porters{grid-template-columns:repeat(2,1fr)}.porters button{padding:16px 8px;font-size:14px;line-height:1.3}
.pb{height:8px;background:var(--bd);border-radius:9px;margin:10px 0}.pb i{display:block;height:8px;background:var(--ok);border-radius:9px}
.tl{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.porters button:disabled,.porters button:disabled:hover{opacity:.6;cursor:not-allowed;border-color:var(--bd);background:var(--bg);color:var(--mu)}
.porters small{display:block;font-weight:600;font-size:12px;margin-top:4px}
.hero{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.hero .logo{font-size:56px}.hero h1{font-size:46px;margin:0;color:var(--pr);letter-spacing:2px}
.hero h2{font-size:16px;letter-spacing:1px;margin:4px 0 28px}
.hb{display:flex;flex-direction:column;gap:12px;width:min(100%,320px)}
.hb button{padding:18px;font-size:18px;font-weight:700;border-radius:12px;border:0;background:var(--pr);color:#fff;cursor:pointer}
.hero{min-height:0;padding:14px 0 30px}
.banner{width:min(100%,560px);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(106,47,184,.25);margin-bottom:20px}.banner svg{display:block;width:100%;height:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--card);border-radius:14px;padding:18px;width:min(100%,360px)}
.lock{color:var(--mu);font-size:12px;margin-top:14px}
body.home{background:radial-gradient(circle at 12% 15%,rgba(232,121,249,.6),transparent 48%),radial-gradient(circle at 88% 12%,rgba(244,114,182,.45),transparent 44%),radial-gradient(circle at 85% 90%,rgba(129,140,248,.65),transparent 52%),radial-gradient(circle at 12% 92%,rgba(192,132,252,.55),transparent 48%),linear-gradient(160deg,#5b21b6,#7c3aed 50%,#a855f7);background-attachment:fixed}
.home .hero{min-height:85vh;justify-content:center}
.home .hero h1{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.home .hero h2{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.home .hb button{background:rgba(76,29,149,.92);box-shadow:0 6px 18px rgba(30,10,70,.4)}
.home .lock{color:rgba(255,255,255,.85)}
header{display:flex;align-items:center;gap:12px}
.lg{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:cover;flex:0 0 auto;border:2px solid rgba(255,255,255,.7)}
.hlogo{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.85);margin-bottom:16px}
.tb{min-height:70px;padding:12px 14px;gap:12px;align-items:center;border-radius:14px;font-size:16px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tb .n{flex:0 0 40px;height:40px;border-radius:50%;background:var(--bd);color:var(--mu);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.tb .lb{flex:1;display:flex;flex-direction:column;text-align:left}.tb .lb b{font-size:15px;line-height:1.3}.tb .lb small{color:var(--mu);font-size:12px;margin-top:2px}
.tb .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.tb.next{background:var(--pr);color:#fff;border-color:var(--pr);box-shadow:0 6px 16px rgba(106,47,184,.35);animation:pl 1.8s infinite}
.tb.next .n{background:#fff;color:var(--pr)}.tb.next .lb small{color:rgba(255,255,255,.92)}
.tb.done .n{background:var(--ok);color:#fff}.tb.done .lb small{color:var(--ok)}
.tb:active:not(:disabled){transform:scale(.98)}
@keyframes pl{50%{box-shadow:0 6px 24px rgba(106,47,184,.65)}}
.sb{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;margin-left:6px;vertical-align:middle;line-height:1.5;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.sb.g{background:#2f9e44}.sb.r{background:#e03131}
.porters button:disabled,.porters button:disabled:hover{opacity:1}
</style>
</head>

var API='https://script.google.com/macros/s/AKfycbzJPAsG_sH6b2wlSUeaMu9hzJHBDN2VpzgJtJx1VLssVzYZtljPnBCt9aW_miN5w8Oecw/exec';
function api(b){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(r){if(!r.ok)throw new Error(r.err||'Ralat pelayan');return r})}
function save(){}
function can(x){return x=='home'||S.role=='admin'||S.role==x}
function go(sec){if(!can(sec))return;S.sec=sec;render()}
var ACC={porter:1,admin:1};
var LB={user:'USER',porter:'PORTER',admin:'ADMIN'};
function out(){S.role=null;S.sec='home';S.openTask=null;render()}
function enter(r){if(can(r))go(r);else if(ACC[r])askLogin(r);else{S.role=r;S.sec=r;render()}}
function askLogin(r){el('lgwrap').innerHTML='<div class="ov"><div class="md"><h2>Log masuk '+LB[r]+'</h2><label>Kata laluan</label><input id="pw" type="password" autocomplete="off" onkeydown="if(event.key==\'Enter\')doLogin(\''+r+'\')"><div id="pe" style="color:#e03131;font-size:13px;min-height:20px;margin-top:4px"></div><div class="row" style="margin-top:6px"><button class="btn sec" onclick="el(\'lgwrap\').innerHTML=\'\'">Batal</button><button class="btn" style="flex:1" onclick="doLogin(\''+r+'\')">Masuk</button></div></div></div>';setTimeout(function(){var p=el('pw');if(p)p.focus()},50)}
function doLogin(r){var p=el('pw').value;el('pe').textContent='Menyemak...';api({a:'login',role:r,pw:p}).then(function(){S.pw[r]=p;S.role=r;el('lgwrap').innerHTML='';S.sec=r;return load()}).then(render,function(e){el('pe').textContent=/salah/.test(e.message)?'Kata laluan salah.':'Tiada sambungan ke pelayan.'})}
function nav(){var h=S.sec=='home';document.body.classList.toggle('home',h);el('hd').style.display=h?'none':'';el('nav').style.display=h?'none':'';var L={user:'User',porter:'Porter',admin:'Admin'};el('nav').innerHTML='<button style="flex:0 0 auto" onclick="out()">Keluar</button>'+['user','porter','admin'].filter(can).map(function(x){return '<button class="'+(S.sec==x?'on':'')+'" onclick="go(\''+x+'\')">'+L[x]+'</button>'}).join('')}
function rHome(){return '<div class="hero"><img class="hlogo" src="'+LOGO+'" alt="Logo HTPN"><h1>I-PORTER</h1><h2>HOSPITAL TENGKU PERMAISURI NORASHIKIN</h2><div class="hb"><button onclick="enter(\'user\')">USER</button><button onclick="enter(\'porter\')">PORTER</button><button onclick="enter(\'admin\')">ADMIN</button></div><div class="lock">Bahagian Porter dan Admin memerlukan kata laluan</div></div>'}
function render(){if(!can(S.sec))S.sec='home';nav();var f={home:rHome,user:rUser,porter:rPorter,admin:rAdmin}[S.sec];el('app').innerHTML=f();checkNotif()}
function busy(p){return S.tasks.some(function(t){return t.porter==p&&!t.t[5]})}
function pBtn(p){var b=busy(p);return '<button '+(b?'disabled':'onclick="assign(\''+p+'\')"')+'>'+p+'<span class="sb '+(b?'r':'g')+'">'+(b?'Pasif':'Aktif')+'</span>'+(b?'<small style="color:var(--mu)">Tugasan belum selesai</small>':'')+'</button>'}
function byId(id){return S.tasks.filter(function(x){return x.id==id})[0]}
function dest(t){var d=t.d;return d.svc=='radio'?'Jabatan Radiologi':d.svc=='jenazah'?'Unit Forensik (dari '+d.jlokasi+')':d.svc=='spesimen'?'Makmal (dari '+d.wad+')':d.svc=='cssd'?'Ambil di '+d.lokasi:d.destJenis?d.destJenis+': '+d.wad:d.wad}
function am(d){if(d.svc=='jenazah')return [['Nama jenazah',d.jnama],['MRN',d.jmrn],['Wad',d.jlokasi],['Destinasi','Unit Forensik'],['Maklumat tambahan',d.khas],['Dimaklumkan kepada staf Unit Forensik',d.forensik],['Staf Unit Forensik yang menerima',d.staf]];if(d.svc=='spesimen')return [['Jenis spesimen',d.item],['Wad / Klinik',d.wad],['Destinasi','Makmal']];if(d.svc=='cssd')return [['Jenis set',d.jenisSet],['Bilangan set',d.bilSet],['Lokasi pengambilan',d.lokasi]];return [['Jenis dokumen',d.item],['Destinasi penghantaran',d.wad]]}

/* USER */
function steps(){var n=['1. Pilih Perkhidmatan','2. Maklumat Permohonan'];return '<div class="steps">'+n.map(function(t,i){return '<div class="'+(S.step==i+1?'on':S.step>i+1?'done':'')+'">'+t+'</div>'}).join('')+'</div>'}
function rUser(){
 var sw='<div class="tabs"><button class="'+(S.ut=='baru'?'on':'')+'" onclick="S.ut=\'baru\';render()">Buat Permohonan</button><button class="'+(S.ut=='status'?'on':'')+'" onclick="S.ut=\'status\';render()">Semak Status ('+S.tasks.length+')</button></div>';
 return sw+(S.ut=='status'?rStatus():rUser0())}
function rStatus(){return '<div class="card"><h2>Semak status pesanan</h2><input placeholder="Cari nama pesakit / MRN / pemohon / porter" value="'+esc(S.q)+'" oninput="S.q=this.value;el(\'sl\').innerHTML=sList()"><div class="row" style="margin-top:8px"><button class="btn sec" onclick="refresh()">Muat semula</button></div></div><div id="sl">'+sList()+'</div>'}
var SL=['Menunggu porter menerima tugasan','Porter telah menerima pesanan','Porter telah tiba di lokasi asal','Porter bergerak ke destinasi tugasan','Porter telah tiba di destinasi tugasan','Tugasan selesai','Tugasan selesai – porter bersedia'];
function sList(){var q=S.q.toLowerCase(),L=S.tasks.filter(function(t){return !q||[t.d.nama,t.d.mrn,t.d.pemohon,t.porter,t.svc,t.d.item].join(' ').toLowerCase().indexOf(q)>-1});
 if(!L.length)return '<div class="card empty">Tiada pesanan dijumpai.</div>';
 return L.slice().reverse().map(function(t){var k=t.t.filter(Boolean).length;
 return '<div class="card"><h2>#'+t.id+' '+esc(t.svc)+'</h2>'+st(t)+' <b style="font-size:14px">'+(t.porter?SL[k]:'Menunggu porter tersedia')+'</b><div class="pb"><i style="width:'+Math.round(k/6*100)+'%"></i></div>'+
 kv([['Pesakit / Item',t.d.nama||t.d.item],['Destinasi',dest(t)],['Pemohon',t.d.pemohon],['Porter',t.porter||'Menunggu porter tersedia'],['Dihantar',ft(t.created)]])+'<h3>Garis masa</h3>'+
 TM.map(function(l,i){return '<div class="tl" style="color:'+(t.t[i]?'var(--ok)':'var(--mu)')+'"><span>'+(t.t[i]?'●':'○')+' '+l+'</span><span>'+ft(t.t[i])+'</span></div>'}).join('')+'</div>'}).join('')}
function rUser0(){
 if(S.step==1)return steps()+'<div class="card"><h2>Pilih perkhidmatan porter</h2>'+SV.map(function(s){return '<button class="svc" onclick="pick(\''+s.id+'\')">'+s.n+'</button>'}).join('')+'</div>';
 if(S.step==2)return steps()+(S.draft.svc=='pesakit'?fPesakit():S.draft.svc=='radio'?fRadio():S.draft.svc=='jenazah'?fJenazah():fLain());
 S.step=1;return rUser0()}
function pick(id){S.draft={svc:id};S.step=2;render()}
function rad(n,vals,cur){return '<div class="opts">'+vals.map(function(v){return '<label class="'+(cur==v?'sel':'')+'"><input type="radio" name="'+n+'" value="'+v+'" onchange="setR(\''+n+'\',this.value)">'+v+'</label>'}).join('')+'</div>'}
function setR(n,v){rd();S.draft[n]=v;render()}
function inp(k,l,ph){return '<label>'+l+'</label><input data-k="'+k+'" value="'+esc(S.draft[k])+'" placeholder="'+(ph||'')+'">'}
function rd(){document.querySelectorAll('[data-k]').forEach(function(e){S.draft[e.dataset.k]=e.value})}
var GK=['Ambulatory','Semi Ambulatory','Non Ambulatory'],TH=['Kritikal','Semi Kritikal','Tidak Kritikal'];
var WADS=['Wad 1','Wad 2','Wad 3','Wad 4','Wad 5','Wad 6','Wad 7','Wad 72','Discharge Lounge'];
var DEST=WADS.concat(['Klinik Perubatan Am','Klinik Pembedahan Am','Klinik Ortopedik','HDU']);
var JAW=['Pegawai Perubatan','Ketua Jururawat','Jururawat Terlatih'];
var KATIL=[];for(var ki=1;ki<=40;ki++)KATIL.push(String(ki));
function sel(k,l,o){var h='<label>'+l+'</label><select data-k="'+k+'"><option value="">-- Pilih --</option>';o.forEach(function(x){h+='<option'+(S.draft[k]==x?' selected':'')+'>'+esc(x)+'</option>'});return h+'</select>'}
function fPesakit(){var d=S.draft;return '<div class="card"><h2>Menguruskan pergerakan pesakit ke Wad / Klinik Pakar / HDU</h2><h3>Bahagian I: Maklumat Pesakit</h3>'+inp('nama','Nama penuh pesakit')+inp('mrn','MRN pesakit')+sel('wadAsal','Lokasi pesakit: Wad',WADS)+sel('katilAsal','Lokasi pesakit: No. katil',KATIL)+'<label>Status pergerakan pesakit</label>'+rad('gerak',GK,d.gerak)+'<label>Kategori pesakit</label>'+rad('tahap',TH,d.tahap)+inp('khas','Lain-lain keperluan khas, jika ada sila nyatakan','Cth: oksigen, IV drip, tiada')+'<h3>Bahagian II: Pilihan Destinasi</h3>'+sel('wad','Wad / Klinik Pakar / HDU',DEST)+'<h3>Bahagian III: Maklumat Pemohon</h3>'+inp('pemohon','Nama pemohon')+sel('jawatan','Jawatan pemohon',JAW)+nxt()+'</div>'}
function fRadio(){var d=S.draft;return '<div class="card"><h2>Menguruskan pergerakan pesakit ke Jabatan Radiologi</h2><h3>Bahagian I: Maklumat Pesakit</h3>'+inp('nama','Nama penuh pesakit')+inp('mrn','MRN pesakit')+sel('wadAsal','Lokasi pesakit: Wad',WADS)+sel('katilAsal','Lokasi pesakit: No. katil',KATIL)+'<label>Status pergerakan pesakit</label>'+rad('gerak',GK,d.gerak)+'<label>Kategori pesakit</label>'+rad('tahap',TH,d.tahap)+'<label>Jenis prosedur yang akan dilakukan</label>'+rad('prosedur',['X-ray','Ultrasound','Lain-lain'],d.prosedur)+(d.prosedur=='Lain-lain'?inp('prosedurLain','Sila nyatakan prosedur'):'')+inp('khas','Lain-lain keperluan khas, jika ada sila nyatakan','Cth: oksigen, IV drip, tiada')+'<h3>Bahagian II: Maklumat Pemohon</h3>'+inp('pemohon','Nama pemohon')+sel('jawatan','Jawatan pemohon',JAW)+nxt()+'</div>'}
function fJenazah(){var d=S.draft;return '<div class="card"><h2>Menguruskan penghantaran jenazah ke Unit Forensik</h2><h3>Bahagian I: Maklumat Jenazah</h3>'+inp('jnama','Nama jenazah')+inp('jmrn','MRN jenazah')+sel('jwad','Wad',WADS)+inp('khas','Maklumat tambahan / khas (jika ada)')+'<h3>Bahagian II: Maklumat Unit Forensik</h3><label>Pemakluman kepada staf Unit Forensik</label>'+rad('forensik',['Ya','Tidak'],d.forensik)+(d.forensik=='Ya'?inp('staf','Nama staf Unit Forensik yang menerima'):'')+'<h3>Bahagian III: Maklumat Pemohon</h3>'+inp('pemohon','Nama pemohon')+sel('jawatan','Jawatan pemohon',JAW)+nxt()+'</div>'}
function fLain(){var d=S.draft,v=d.svc,h,t=SV.filter(function(x){return x.id==v})[0];
 if(v=='spesimen')h='<h3>Bahagian I: Maklumat Am</h3><label>Jenis spesimen</label>'+rad('jenis',['Darah','Urin','Kahak','Lain-lain'],d.jenis)+(d.jenis=='Lain-lain'?inp('jenisLain','Sila nyatakan jenis spesimen'):'')+inp('wad','Wad / Klinik');
 else if(v=='cssd')h='<h3>Bahagian I: Maklumat Am</h3>'+inp('jenisSet','Jenis set')+'<label>Bilangan set</label><input data-k="bilSet" type="number" min="1" value="'+esc(d.bilSet)+'">'+inp('lokasi','Lokasi pengambilan set');
 else h='<h3>Bahagian I: Maklumat Am</h3>'+inp('item','Jenis dokumen')+inp('wad','Destinasi penghantaran dokumen');
 return '<div class="card"><h2>'+t.n+'</h2>'+h+'<h3>Bahagian II: Maklumat Pemohon</h3>'+inp('pemohon','Nama pemohon')+inp('jawatan','Jawatan pemohon')+nxt()+'</div>'}
function nxt(){return '<div class="row"><button class="btn sec" onclick="rd();S.step=1;render()">← Kembali</button><button class="btn" style="flex:1" onclick="toStep3()">Hantar Permohonan</button></div>'}
function toStep3(){rd();var d=S.draft,v=d.svc,ok;
 if(v=='pesakit'){ok=d.nama&&d.wadAsal&&d.wad&&d.pemohon&&d.jawatan;if(ok)d.lokasi=d.wadAsal+(d.katilAsal?', Katil '+d.katilAsal:'')}
 else if(v=='radio'){ok=d.nama&&d.wadAsal&&d.prosedur&&d.pemohon&&d.jawatan;if(ok)d.lokasi=d.wadAsal+(d.katilAsal?', Katil '+d.katilAsal:'')}
 else if(v=='spesimen'){ok=d.jenis&&d.wad&&d.pemohon;if(ok)d.item=d.jenis=='Lain-lain'&&d.jenisLain?'Lain-lain: '+d.jenisLain:d.jenis}
 else if(v=='cssd'){ok=d.jenisSet&&d.bilSet&&d.lokasi&&d.pemohon;if(ok)d.item=d.jenisSet+' (x'+d.bilSet+')'}
 else if(v=='jenazah'){ok=d.jnama&&d.jwad&&d.forensik&&(d.forensik!='Ya'||d.staf)&&d.pemohon;if(ok){d.item=d.jnama;d.jlokasi=d.jwad}}
 else ok=d.item&&d.wad&&d.pemohon;
 if(!ok){alert('Sila lengkapkan maklumat wajib (Bahagian I dan nama pemohon).');return}submit()}
function sv(){try{sessionStorage.setItem('iporter_u',JSON.stringify({m:S.mine,n:S.notif}))}catch(e){}}
function checkNotif(){if(S.role!='user')return;S.tasks.forEach(function(t){if(S.mine.indexOf(t.id)>-1&&t.t[0]&&S.notif.indexOf(t.id)<0){S.notif.push(t.id);sv();el('popwrap').innerHTML='<div class="pop" onclick="el(\'popwrap\').innerHTML=\'\';S.ut=\'status\';render()">Porter '+esc(t.porter)+' telah menerima pesanan dan dalam perjalanan.<small>Klik untuk semak status pesanan</small></div>'}})}
function submit(){var d=JSON.parse(JSON.stringify(S.draft)),b=document.querySelector('[onclick="toStep3()"]');if(b){b.disabled=true;b.textContent='Menghantar...'}
 api({a:'submit',d:d,svcName:SV.filter(function(x){return x.id==d.svc})[0].n}).then(function(r){var t=r.task;S.mine.push(t.id);sv();S.draft={};S.step=1;return load().then(function(){
 el('popwrap').innerHTML='<div class="pop" onclick="el(\'popwrap\').innerHTML=\'\';S.ut=\'status\';render()">'+(t.porter?'Permohonan anda telah diterima. Porter '+esc(t.porter)+' akan respon.':'Permohonan anda telah diterima. Sedang menunggu porter tersedia.')+'<small>Anda akan dimaklumkan apabila porter menerima pesanan.</small></div>';render()})}).catch(function(e){alert('Gagal menghantar: '+e.message);if(b){b.disabled=false;b.textContent='Hantar Permohonan'}})}
function openPop(id){if(!can('porter'))return;var t=byId(id);el('popwrap').innerHTML='';S.porter=t.porter;S.openTask=id;S.sec='porter';render()}

/* PORTER */
function rPorter(){
 var tabs='<div class="tabs">'+PT.map(function(p){var c=S.tasks.filter(function(t){return t.porter==p&&!t.t[5]}).length;return '<button class="'+(S.porter==p?'on':'')+'" onclick="S.porter=\''+p+'\';S.openTask=null;render()">'+p+' <span class="sb '+(busy(p)?'r">Pasif':'g">Aktif')+'</span>'+(c?' ('+c+')':'')+'</button>'}).join('')+'</div>';
 var mine=S.tasks.filter(function(t){return t.porter==S.porter});
 if(S.openTask){var t=byId(S.openTask);if(t&&t.porter==S.porter)return tabs+task(t)}
 if(!mine.length)return tabs+'<div class="card empty">Tiada tugasan untuk '+S.porter+'.</div>';
 return tabs+'<div class="card"><h2>Senarai tugasan '+S.porter+'</h2>'+mine.slice().reverse().map(function(t){return '<button class="svc" onclick="S.openTask='+t.id+';render()"><b>#'+t.id+'</b>'+esc(t.svc)+'<br><small style="color:var(--mu)">'+esc(t.d.nama||t.d.item||'')+' → '+esc(dest(t))+'</small> '+st(t)+'</button>'}).join('')+'</div>'}
function st(t){return t.t[5]?'<span class="tag ok">Selesai</span>':t.t[0]?'<span class="tag wn">Dalam tugasan</span>':(t.porter?'<span class="tag">Baharu</span>':'<span class="tag wn">Menunggu porter</span>')}
function kv(a){return '<div class="kv">'+a.filter(function(x){return x[1]}).map(function(x){return '<span>'+x[0]+'</span><span>'+esc(x[1])+'</span>'}).join('')+'</div>'}
function task(t){var d=t.d,k=0;while(k<6&&t.t[k])k++;
 return '<div class="card"><h2>Tugasan #'+t.id+' '+st(t)+'</h2><p style="margin:0 0 8px;color:var(--mu)">'+esc(t.svc)+'</p>'+
 (d.nama?'<h3>Maklumat Pesakit</h3>'+kv([['Nama',d.nama],['MRN',d.mrn],['Lokasi',d.lokasi],['Status pergerakan',d.gerak],['Jenis prosedur',d.prosedur=='Lain-lain'&&d.prosedurLain?'Lain-lain: '+d.prosedurLain:d.prosedur],['Tahap kesihatan',d.tahap],['Keperluan khas',d.khas]]):'<h3>Maklumat Am</h3>'+kv(am(d)))+
 (d.nama?'<h3>Maklumat Wad / Destinasi</h3>'+kv(d.svc=='pesakit'?[['Destinasi',d.wad]]:[['Destinasi',d.svc=='radio'?'Jabatan Radiologi':''],[d.svc=='radio'?'Wad pemohon':'Wad / Destinasi',d.wad],['No. katil',d.katil]]):'')+
 '<h3>Maklumat Pemohon</h3>'+kv([['Nama',d.pemohon],['Jawatan',d.jawatan]])+'</div>'+
 '<div class="card"><h2>Rekod Pergerakan '+t.porter+'</h2>'+'<div class="pb"><i style="width:'+Math.round(k/6*100)+'%"></i></div><p style="margin:0 0 10px;color:var(--mu);font-size:13px">'+(k>=6?'Semua langkah selesai':'Langkah '+(k+1)+' daripada 6')+'</p>'+TM.map(function(l,i){var d=!!t.t[i],c=d?'done':i==k?'next':'';return '<button class="tb '+c+'" '+(i==k?'':'disabled')+' onclick="rec('+t.id+','+i+')"><span class="n">'+(i+1)+'</span><span class="lb"><b>'+l+'</b><small>'+(d?'Direkod':i==k?'Tekan untuk rekod masa':'Menunggu langkah sebelumnya')+'</small></span><span class="tm">'+(d?ft(t.t[i]):'')+'</span></button>'}).join('')+
 '<div class="row"><button class="btn sec" onclick="S.openTask=null;render()">← Senarai tugasan</button></div></div>'}
function rec(id,i){var b=document.querySelector('.tb.next');if(b)b.disabled=true;
 api({a:'rec',id:id,i:i,pw:S.pw.porter||S.pw.admin}).then(function(r){var as=r.assigned||[];return load().then(function(){try{if(navigator.vibrate)navigator.vibrate(40)}catch(e){}render();var n=document.querySelector('.tb.next');if(n&&n.scrollIntoView)n.scrollIntoView({block:'center',behavior:'smooth'});
 if(as.length&&can('porter')){S.seenA=as[as.length-1].assigned;el('popwrap').innerHTML='<div class="pop" onclick="openPop('+as[0].id+')">'+as[0].porter+' terdapat 1 tugasan untuk anda<small>Klik di sini untuk membuka tugasan</small></div>'}})}).catch(function(e){alert(e.message);refresh()})}

/* ADMIN */
function rAdmin(){
 var T=S.tasks,dn=T.filter(function(t){return t.t[5]}).length,pr=T.filter(function(t){return t.t[0]&&!t.t[5]}).length,nw=T.filter(function(t){return !t.t[0]}).length;
 var list=S.adminTab=='semua'?T:T.filter(function(t){return t.porter==S.adminTab});
 var h='<div class="stats"><div><b>'+T.length+'</b><span>Jumlah tugasan</span></div><div><b>'+nw+'</b><span>Baharu</span></div><div><b>'+pr+'</b><span>Dalam tugasan</span></div><div><b>'+dn+'</b><span>Selesai</span></div></div>';
 h+='<div class="tabs">'+['semua'].concat(PT).map(function(p){return '<button class="'+(S.adminTab==p?'on':'')+'" onclick="S.adminTab=\''+p+'\';render()">'+(p=='semua'?'Semua':p+' <span class="sb '+(busy(p)?'r">Pasif':'g">Aktif')+'</span>')+'</button>'}).join('')+'</div>';
 if(!list.length)return h+'<div class="card empty">Tiada rekod tugasan.</div>';
 h+='<div class="card tw"><table><tr><th>#</th><th>Masa Permohonan</th><th>Perkhidmatan</th><th>Pesakit / Item</th><th>Destinasi</th><th>Pemohon</th><th>Porter</th>'+TM.map(function(_,i){return '<th>M'+(i+1)+'</th>'}).join('')+'<th>Tempoh</th><th>Status</th></tr>'+
 list.slice().reverse().map(function(t){return '<tr><td>'+t.id+'</td><td>'+fdt(t.created)+'</td><td>'+esc(t.svc.split(' ').slice(0,3).join(' '))+'…</td><td>'+esc(t.d.nama||t.d.item||'')+'</td><td>'+esc(dest(t))+'</td><td>'+esc(t.d.pemohon)+'</td><td>'+(t.porter||'Menunggu')+'</td>'+t.t.map(function(x){return '<td>'+ft(x)+'</td>'}).join('')+'<td>'+dur(t.t[0],t.t[4])+'</td><td>'+st(t)+'</td></tr>'}).join('')+'</table></div>'+
 '<p style="color:var(--mu);font-size:12px">Masa Permohonan = masa user menghantar permohonan. M1–M6: '+TM.map(function(l,i){return (i+1)+'='+l}).join('; ')+'</p><div class="row"><button class="btn sec" onclick="if(confirm(\'Padam semua rekod?\')){clearAll()}">Padam semua rekod</button></div>';
 return h}
setInterval(function(){if(document.hidden)return;load().then(function(ok){if(!ok)return;
 var a=S.tasks.filter(function(t){return t.porter&&t.assigned&&t.assigned>S.seenA&&!t.t[5]}).sort(function(x,y){return x.assigned<y.assigned?-1:1});
 if(a.length){var t=a[a.length-1];S.seenA=t.assigned;if(S.role=='porter')el('popwrap').innerHTML='<div class="pop" onclick="openPop('+t.id+')">'+t.porter+' terdapat 1 tugasan untuk anda<small>Klik di sini untuk membuka tugasan</small></div>'}
 checkNotif();
 if(S.sec=='porter'||S.sec=='admin')render();else if(S.sec=='user'&&S.ut=='status'&&el('sl'))el('sl').innerHTML=sList()})},6000);
try{var uu=JSON.parse(sessionStorage.getItem('iporter_u')||'null');if(uu){S.mine=uu.m||[];S.notif=uu.n||[]}}catch(e){}
document.getElementById('hlg').src=LOGO;
render();load().then(function(){S.seenA=S.tasks.reduce(function(m,t){return t.assigned&&t.assigned>m?t.assigned:m},'');render()});
</script>
</body>
</html>
